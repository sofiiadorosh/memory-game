<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header class="header">
    <div class="container header__container">
      <ul class="control__list">
        <li class="control__item">
          <button type="button" class="control__button" data-sidebar-open>Settings</button>
        </li>
        <li class="control__item">
          <button type="button" class="control__button control__button_primary" data-new-game>New game</button>
        </li>
        <li class="control__item">
          <button type="button" class="control__button" data-leaderboard-open>Leader board</button>
        </li>
      </ul>
      <ul class="stat__list">
        <li class="stat__item">
          <span class="stat__title">Moves:</span>
          <span class="stat__number" id="moves">0</span>
        </li>
        <li class="stat__item">
          <span class="stat__title">Pairs found:</span>
          <div class="stat__content">
            <span class="stat__number" id="pairs">0</span>
            <span class="stat__delimiter">/</span>
            <span class="stat__total">8</span>
          </div>
        </li>
      </ul>
    </div>
  </header>
  <main>
    <aside class="sidebar" id="sidebar" aria-hidden="true">
      <div class="sidebar__backdrop" data-sidebar-close></div>
      <div class="sidebar__panel" role="dialog" aria-modal="true" aria-labelledby="sidebar-title">
        <div class="sidebar__header">
          <div class="sidebar__heading">
            <div class="sidebar__content">
              <h2 class="sidebar__title" id="sidebar-title">Settings</h2>
              <p class="sidebar__subtitle">Choose what you want to play with</p>
            </div>
            <button type="button" class="sidebar__close" aria-label="Close settings" data-sidebar-close></button>
          </div>
          <div class="sidebar__tabs" role="tablist">
            <button type="button" class="sidebar__tab sidebar__tab_active" id="tab-categories" role="tab" aria-selected="true" aria-controls="panel-categories" data-tab="categories">Categories</button>
            <button type="button" class="sidebar__tab" id="tab-designs" role="tab" aria-selected="false" aria-controls="panel-designs" data-tab="designs" tabindex="-1">Cards</button>
          </div>
        </div>
        <div class="sidebar__body">
          <div class="sidebar__tab-panel" id="panel-categories" role="tabpanel" aria-labelledby="tab-categories">
            <ul class="category__list"></ul>
          </div>
          <div class="sidebar__tab-panel" id="panel-designs" role="tabpanel" aria-labelledby="tab-designs" hidden>
            <div class="preview card__list_notebook">
              <div class="preview__card">
                <div class="card__content preview__content">
                  <div class="card__back"></div>
                  <div class="card__front preview__front">🐶</div>
                </div>
              </div>
              <div class="preview__shadow"></div>
            </div>
            <ul class="design__list"></ul>
          </div>
        </div>
        <div class="sidebar__footer">
          <span class="sidebar__status"></span>
        </div>
      </div>
    </aside>
    <section class="game">
      <div class="container game__container">
        <ul class="card__list"></ul>
      </div>
    </section>
    <div class="modal" id="leaderboard" aria-hidden="true">
      <div class="modal__backdrop" data-modal-close></div>
      <div class="modal__window" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
        <div class="modal__header">
          <div>
            <h2 class="modal__title" id="leaderboard-title">Leader board</h2>
            <p class="modal__subtitle">Top 10 games with the fewest moves</p>
          </div>
        </div>
        <div class="leaderboard__table" role="table" aria-labelledby="leaderboard-title">
          <div class="leaderboard__head" role="rowgroup">
            <div class="leaderboard__row leaderboard__row_head" role="row">
              <div class="leaderboard__heading" role="columnheader">Place</div>
              <div class="leaderboard__heading" role="columnheader">Moves</div>
              <div class="leaderboard__heading" role="columnheader">Date</div>
            </div>
          </div>
          <div class="leaderboard__body" role="rowgroup"></div>
        </div>
        <p class="leaderboard__empty" hidden>No results yet</p>
        <button type="button" class="modal__button" data-modal-close>Close</button>
      </div>
    </div>
  </main>
  <script src="./js/game.js" type="module"></script>
  <script src="./js/sidebar.js" type="module"></script>
  <script src="./js/leaderboard.js" type="module"></script>
</body>
</html>
