<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <header class="header">
    <div class="container header__container">
      <ul class="control__list">
        <li class="control__item">
          <button type="button" class="control__button">New game</button>
        </li>
        <li class="control__item">
          <button type="button" class="control__button">Leader board</button>
        </li>
      </ul>
      <ul class="stat__list">
        <li class="stat__item">
          <span class="stat__title">Moves:</span>
          <span class="stat__number">0</span>
        </li>
        <li class="stat__item">
          <span class="stat__title">Pairs found:</span>
          <div class="stat__content">
            <span class="stat__number">0</span>
            <span class="stat__delimiter">/</span>
            <span class="stat__total">8</span>
          </div>
        </li>
      </ul>
    </div>
  </header>
  <main>
    <section class="game">
      <div class="container game__container">
        <ul class="card__list">
          <li class="card__item">
            <div class="card__content">
              <div class="card__back">?</div>
              <div class="card__front">🐷</div>

          </li>

          <li class="card__item">
            <div class="card__content">
              <div class="card__back">?</div>
              <div class="card__front">🦦</div>
            </div>
          </li>
          <li class="card__item">
            <div class="card__content">
              <div class="card__back">?</div>
              <div class="card__front">🐹</div>
            </div>
          </li>
          <li class="card__item">
            <div class="card__content">
              <div class="card__back">?</div>

            </div>
          </li>
